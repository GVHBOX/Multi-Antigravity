[package]
name = "multi-antigravity-rust"
version = "0.1.0"
edition = "2024"
exclude = ["data/**", "*.WebView2/**"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = "0.29.0"
ratatui = "0.30.2"
slint = "1.18.1"
sysinfo = "0.39.6"
tray-icon = "0.26.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }

[profile.release]
strip = true
lto = "thin"

[build-dependencies]
slint-build = "1.18.1"
winres = "0.1.12"
